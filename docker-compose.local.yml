services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: impact_db
      POSTGRES_USER: impact_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_only}
    volumes:
      - campusripple_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impact_user -d impact_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-local-development-only-secret-change-before-any-real-deployment}
      COOKIE_SECURE: "false"
      SKIP_AUTO_SCHEMA: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"
      PUBLIC_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql+psycopg://impact_user:${POSTGRES_PASSWORD:-local_dev_password_only}@db:5432/impact_db
      MAIL_SERVER: ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_DEFAULT_SENDER: ""
      INSTITUTIONAL_EMAIL_DOMAINS: ""
      COLLEGE_DATA_API_URL: ""
      COLLEGE_DATA_API_TOKEN: ""
    command: ["sh", "-c", "flask --app wsgi:app db upgrade && exec gunicorn wsgi:app --bind 0.0.0.0:8000 --workers 2 --timeout 60"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  campusripple_local_db:
